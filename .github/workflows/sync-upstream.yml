# Keeps main aligned with cad-polito-it/ase_riscv_gem5_sim, and the
# ase-studio-macos branch (ASE Studio for the macOS app, with the Portale
# della Didattica features) aligned with cad-polito-it/ase-studio.
# main uses the same API as GitHub's "Sync fork" button: a fast-forward when
# possible, otherwise a merge commit on top of the macOS changes of this fork.
# A conflict makes the run fail; resolve it locally and push.
name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main)
          echo "$result"
          echo "### Sync upstream" >> "$GITHUB_STEP_SUMMARY"
          echo "$result" | jq -r '"- \(.message) (\(.merge_type))"' >> "$GITHUB_STEP_SUMMARY"

  sync-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ase-studio-macos
        uses: actions/checkout@v4
        with:
          ref: ase-studio-macos
          fetch-depth: 0
          path: studio
      - name: Check out the checks (main)
        uses: actions/checkout@v4
        with:
          path: fork
      - name: Merge cad-polito-it/ase-studio main
        id: merge
        working-directory: studio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/cad-polito-it/ase-studio.git main
          before=$(git rev-parse HEAD)
          git merge --no-edit -m "Merge cad-polito-it/ase-studio main" FETCH_HEAD
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "- ase-studio-macos is up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The installed apps download ase-studio-macos with "Update": a merge
      # that fails the checks is not pushed. A manual run always checks.
      - name: Check the merged ASE Studio
        if: steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: bash fork/utils/macOS/tests/run_checks.sh studio
      - name: Push ase-studio-macos
        if: steps.merge.outputs.changed == 'true'
        working-directory: studio
        run: |
          git push origin HEAD:ase-studio-macos
          echo "- ase-studio-macos merged $(git rev-parse --short FETCH_HEAD) (checks passed)" >> "$GITHUB_STEP_SUMMARY"
